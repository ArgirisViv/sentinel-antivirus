name: Sentinel AV Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ engine and tests
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build C++ engine and tests
        run: cmake --build build --config Release --parallel

      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare engine for app packaging
        run: Copy-Item .\build\Release\sentinel-av.exe .\build\sentinel-av.exe
        shell: pwsh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: management/pom.xml

      - name: Package Windows desktop app
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Release tags must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH."
          }
          .\scripts\package-app.ps1 -Version $version
        shell: pwsh

      - name: Create release archive
        run: |
          $archive = '.\dist\SentinelAV-windows-x64.zip'
          Compress-Archive -Path .\dist\SentinelAV -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  SentinelAV-windows-x64.zip" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
        shell: pwsh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" .\dist\SentinelAV-windows-x64.zip .\dist\SHA256SUMS.txt --title "Sentinel AV $env:GITHUB_REF_NAME" --generate-notes
        shell: pwsh
